    cintaMasking:     { por: 25,  costo: 85.00,  unidad: "rollo c/25m²"  },
    plasticoProtector:{ por: 1,   costo: 12.00,  unidad: "por m² de piso"},
    lijaAgua:         { por: 15,  costo: 15.00,  unidad: "pliego c/15m²" },
    felpaMicrofibra:  { por: 80,  costo: 65.00,  unidad: "pieza c/80m²"  }
  },

  // ─── MODIFICADORES ──────────────────────────────────────
  modificadores: {
    casaHabitada:   { nombre: "Casa habitada / amueblada",        mulMO: 1.15 },
    cristalFino:    { nombre: "Protección cristal / aluminio",    mulMO: 1.10 },
    humedadSevera:  { nombre: "Daño por humedad / salitre",       cargoFijo: 1500 },
    airless:        { nombre: "Equipo Airless",                   cargoFijo: 500  },
    alturaRapel:    { nombre: "Trabajo en altura con arnés/rapel", mulMO: 1.65 } // promedio 50-80%
  },

  // ─── OPERACIÓN Y LOGÍSTICA (proporcional, oculto) ───────
  // Se distribuye dentro de "Gastos de operación y logística"
  // Representa transporte, gasolina, herramienta
  // Equivale al colchón de negociación (~13.6% del total)
  operacionPct: 0.136,

  // ─── RESANADO ───────────────────────────────────────────
  resanado: {
    normal:   { nombre: "Resanado normal (incluido)",    costo: 0      },
    excesivo: { nombre: "Resanado excesivo",             costoPorM2: 45 }
  }
};

// ═══════════════════════════════════════════════════════════
// FUNCIÓN PRINCIPAL DE CÁLCULO
// ═══════════════════════════════════════════════════════════
function calcularPresupuesto(params) {
  const {
    tipoTrabajo,    // "interior"|"exterior_bajo"|"exterior_alto"|"techo"|"herreria"
    metros,         // número (m² para pintura, piezas para herrería)
    manos,          // 1 o 2
    pinturaKey,     // key de DB.pinturas
    equipoAirless,  // bool
    modificadoresSel, // array de keys de DB.modificadores
    resanadoExcesivo, // bool
    herreriaItems,  // array [{key, cantidad}] para herrería
    anticipo,       // porcentaje 0-60
  } = params;

  let conceptos = [];
  let subtotalMO = 0;
  let subtotalMaterial = 0;
  let subtotalConsumo = 0;
  let subtotalExtras = 0;

  const pintura = DB.pinturas[pinturaKey];

  // ── 1. MANO DE OBRA ─────────────────────────────────────
  if (tipoTrabajo !== "herreria") {
    const moKey = tipoTrabajo === "interior" || tipoTrabajo === "techo"
      ? (tipoTrabajo === "techo" ? "MO_INT_PLA" : "MO_INT_MUR")
      : tipoTrabajo === "exterior_bajo" ? "MO_EXT_BAJ" : "MO_EXT_ALT";

    const mo = DB.manoDeObra[moKey];
    let costoPorM2 = manos === 2 ? mo.c2 : mo.c1;

    // Aplicar modificadores a MO
    let mulMO = 1.0;
    (modificadoresSel || []).forEach(key => {
      if (DB.modificadores[key]?.mulMO) mulMO *= DB.modificadores[key].mulMO;
    });
    costoPorM2 = costoPorM2 * mulMO;

    subtotalMO = metros * costoPorM2;
    conceptos.push({
      descripcion: `${mo.nombre}${manos===2?" (2 manos)":""}${mulMO>1?" con modificadores":""}`,
      area: metros, unit: "m²",
      precio: parseFloat(costoPorM2.toFixed(2)),
      total: parseFloat(subtotalMO.toFixed(2))
    });
  }

  // ── 2. PINTURA / MATERIAL ────────────────────────────────
  if (tipoTrabajo !== "herreria" && pintura) {
    const rend = manos === 2 ? pintura.rendimiento * 0.55 : pintura.rendimiento;
    const litros = Math.ceil(metros / rend);
    subtotalMaterial = litros * pintura.costoLitro;
    conceptos.push({
      descripcion: `${pintura.marca} ${pintura.linea} (${litros} L)`,
      area: litros, unit: "L",
      precio: pintura.costoLitro,
      total: parseFloat(subtotalMaterial.toFixed(2))
    });
  }

  // ── 3. HERRERÍA ──────────────────────────────────────────
  if (tipoTrabajo === "herreria" && herreriaItems?.length > 0) {
    herreriaItems.forEach(item => {
      const h = DB.herreria[item.key];
      if (!h) return;
      const precioUnitario = (h.precioMin + h.precioMax) / 2;
      const total = precioUnitario * item.cantidad;
      subtotalMO += total;
      conceptos.push({
        descripcion: h.nombre,
        area: item.cantidad, unit: "pza",
        precio: precioUnitario,
        total: parseFloat(total.toFixed(2))
      });
    });
  }

  // ── 4. CONSUMIBLES ───────────────────────────────────────
  if (tipoTrabajo !== "herreria" && metros > 0) {
    const c = DB.consumibles;
    let totalConsumo = 0;
    totalConsumo += Math.ceil(metros / c.cintaMasking.por)     * c.cintaMasking.costo;
    totalConsumo += Math.ceil(metros * 0.6)                    * c.plasticoProtector.costo; // 60% del área
    totalConsumo += Math.ceil(metros / c.lijaAgua.por)         * c.lijaAgua.costo;
    if (!equipoAirless) {
      totalConsumo += Math.ceil(metros / c.felpaMicrofibra.por) * c.felpaMicrofibra.costo;
    }
    subtotalConsumo = totalConsumo;
    conceptos.push({
      descripcion: "Materiales auxiliares (cintas, plásticos, lijas)",
      area: 1, unit: "estimado",
      precio: parseFloat(totalConsumo.toFixed(2)),
      total: parseFloat(totalConsumo.toFixed(2))
    });
  }

  // ── 5. EXTRAS ────────────────────────────────────────────
  if (equipoAirless) {
    subtotalExtras += DB.modificadores.airless.cargoFijo;
    conceptos.push({ descripcion:"Uso de equipo Airless", area:1, unit:"servicio", precio:500, total:500 });
  }
  if (resanadoExcesivo && tipoTrabajo !== "herreria") {
    const costoRes = metros * DB.resanado.excesivo.costoPorM2;
    subtotalExtras += costoRes;
    conceptos.push({ descripcion:"Resanado excesivo", area:metros, unit:"m²", precio:45, total:parseFloat(costoRes.toFixed(2)) });
  }
  (modificadoresSel || []).forEach(key => {
    const mod = DB.modificadores[key];
    if (mod?.cargoFijo && key !== "airless") {
      subtotalExtras += mod.cargoFijo;
      conceptos.push({ descripcion:mod.nombre, area:1, unit:"servicio", precio:mod.cargoFijo, total:mod.cargoFijo });
    }
  });

  // ── 6. GASTOS DE OPERACIÓN Y LOGÍSTICA (oculto en colchón) ──
  const baseAntesOp = subtotalMO + subtotalMaterial + subtotalConsumo + subtotalExtras;
  const gastosOp = Math.round(baseAntesOp * DB.operacionPct / 100) * 100;
  conceptos.push({
    descripcion: "Gastos de operación y logística",
    area: 1, unit: "servicio",
    precio: gastosOp,
    total: gastosOp
  });

  // ── 7. TOTALES ───────────────────────────────────────────
  const subtotal = baseAntesOp + gastosOp;
  const anticipoMonto = anticipo > 0 ? parseFloat((subtotal * anticipo / 100).toFixed(2)) : 0;

  return {
    conceptos,
    subtotalMO:       parseFloat(subtotalMO.toFixed(2)),
    subtotalMaterial: parseFloat(subtotalMaterial.toFixed(2)),
    subtotalConsumo:  parseFloat(subtotalConsumo.toFixed(2)),
    subtotalExtras:   parseFloat(subtotalExtras.toFixed(2)),
    gastosOp,
    subtotal:         parseFloat(subtotal.toFixed(2)),
    anticipoPct:      anticipo,
    anticipoMonto
  };
}

</script>
<script type="text/babel" id="appscript">

const { useState, useEffect, useRef } = React;

// ─── Constants ───────────────────────────────────────────────────────────────
const PAINT_BRANDS  = ["Comex","Volton","Otra"];
const FINISH_TYPES  = ["Mate","Satinado","Semi-satinado"];
const WORK_TYPES    = ["Pintura interior","Pintura exterior","Pintura de techo","Pintura de fachada","Pintura decorativa","Sellado / impermeabilización","Pintura de herrería","Pintura de madera","Lija y preparación","Otro"];
const STORAGE_KEY   = "paintforlife_v4";
const QUOTES_KEY    = "paintforlife_quotes_v2";
const MONTHS_ES     = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

function loadData(key){ try{ return JSON.parse(localStorage.getItem(key)||"[]"); }catch{ return []; } }
function saveData(key,val){ localStorage.setItem(key,JSON.stringify(val)); }
function genId(p="PFL"){ return `${p}-${Date.now().toString(36).toUpperCase()}`; }
function fmtDate(d){ if(!d) return "—"; const[y,m,day]=d.split("-"); return `${day}/${m}/${y}`; }
function fmtShort(d){ if(!d) return "—"; const[y,m,day]=d.split("-"); return `${day} ${MONTHS_ES[+m-1]} ${y}`; }
function today(){ return new Date().toISOString().slice(0,10); }

const blankTask  = ()=>({ uid:Math.random().toString(36).slice(2), workType:"", workTypeOther:"", paintBrand:"", paintBrandOther:"", paintColor:"", paintCode:"", finish:"", quantityType:"litros", liters:"", buckets:"", gallons:"", notes:"" });
const blankJob   = ()=>({ id:genId(), client:"", address:"", city:"", date:today(), status:"por_realizar", tasks:[blankTask()], createdAt:new Date().toISOString() });
const blankQuote = ()=>({ id:genId("COT"), client:"", clientPhone:"", address:"", city:"", date:today(), validDays:"15", sqMeters:"", workType:"interior", items:[], laborCost:"", materialCost:"", discount:"", notes:"", tax:"16", status:"borrador", aiGenerated:false, pendingAI:false, createdAt:new Date().toISOString() });

// ─── App ─────────────────────────────────────────────────────────────────────
function App(){
  const [jobs,      setJobs]      = useState(()=>loadData(STORAGE_KEY));
  const [quotes,    setQuotes]    = useState(()=>loadData(QUOTES_KEY));
  const [screen,    setScreen]    = useState("home");
  const [editJob,   setEditJob]   = useState(null);
  const [viewJob,   setViewJob]   = useState(null);
  const [editQuote, setEditQuote] = useState(null);
  const [viewQuote, setViewQuote] = useState(null);
  const [toast,     setToast]     = useState(null);
  const [dash,      setDash]      = useState(null);

  useEffect(()=>{ saveData(STORAGE_KEY,jobs); },[jobs]);
  useEffect(()=>{ saveData(QUOTES_KEY,quotes); },[quotes]);

  // Check pending AI quotes when online
  useEffect(()=>{
    function checkPending(){
      const pending = quotes.filter(q=>q.pendingAI);
      if(pending.length>0 && navigator.onLine){
        setToast({msg:`Tienes ${pending.length} presupuesto(s) pendiente(s) de procesar con IA`,ok:true,long:true});
      }
    }
    window.addEventListener("online", checkPending);
    return ()=>window.removeEventListener("online", checkPending);
  },[quotes]);

  function showToast(msg,ok=true){ setToast({msg,ok}); setTimeout(()=>setToast(null),3000); }

  function saveJob(job){
    setJobs(p=>{ const e=p.find(j=>j.id===job.id); return e?p.map(j=>j.id===job.id?job:j):[job,...p]; });
    showToast("Proyecto guardado ✓"); setScreen("jobs");
  }
  function deleteJob(id){ setJobs(p=>p.filter(j=>j.id!==id)); showToast("Eliminado",false); setScreen("jobs"); }
  function updateJobStatus(id,status){ setJobs(p=>p.map(j=>j.id===id?{...j,status}:j)); }

  function saveQuote(q){
    setQuotes(p=>{ const e=p.find(x=>x.id===q.id); return e?p.map(x=>x.id===q.id?q:x):[q,...p]; });
    showToast("Cotización guardada ✓"); setScreen("quotes");
  }
  function deleteQuote(id){ setQuotes(p=>p.filter(q=>q.id!==id)); showToast("Eliminada",false); setScreen("quotes"); }

  // When quote accepted → create job
  function acceptQuote(quoteId){
    const q = quotes.find(x=>x.id===quoteId);
    if(!q) return;
    setQuotes(p=>p.map(x=>x.id===quoteId?{...x,status:"aceptada"}:x));
    const newJob = {
      id: genId(),
      client: q.client,
      address: q.address,
      city: q.city||"",
      date: today(),
      status: "por_realizar",
      fromQuote: quoteId,
      tasks: [blankTask()],
      createdAt: new Date().toISOString()
    };
    setJobs(p=>[newJob,...p]);
    showToast("✓ Presupuesto aceptado — trabajo creado");
  }

  return (
    <div style={S.root}>
      <style>{CSS}</style>
      {toast && <div className={`toast ${toast.ok?"tok":"terr"}`}>{toast.msg}</div>}

      {screen==="home"        && <HomeScreen onNav={s=>setScreen(s)} jobs={jobs} quotes={quotes}/>}
      {screen==="dashboard"   && <DashboardScreen jobs={jobs} dash={dash} setDash={setDash} onBack={()=>setScreen("home")} onOpenJob={j=>{setViewJob(j);setScreen("jobDetail");}}/>}
      {screen==="jobs"        && <JobsScreen jobs={jobs} onBack={()=>setScreen("home")} onNew={()=>{setEditJob(blankJob());setScreen("jobForm");}} onOpen={j=>{setViewJob(j);setScreen("jobDetail");}} onStatusChange={updateJobStatus}/>}
      {screen==="jobForm"     && editJob && <JobForm job={editJob} onSave={saveJob} onCancel={()=>setScreen("jobs")}/>}
      {screen==="jobDetail"   && viewJob && <JobDetail job={jobs.find(j=>j.id===viewJob.id)||viewJob} onBack={()=>setScreen("jobs")} onEdit={()=>{setEditJob(jobs.find(j=>j.id===viewJob.id)||viewJob);setScreen("jobForm");}} onDelete={()=>deleteJob(viewJob.id)} onStatusChange={updateJobStatus}/>}
      {screen==="quotes"      && <QuotesScreen quotes={quotes} jobs={jobs} onBack={()=>setScreen("home")} onNew={()=>{setEditQuote(blankQuote());setScreen("quoteForm");}} onOpen={q=>{setViewQuote(q);setScreen("quoteDetail");}}/>}
      {screen==="quoteForm"   && editQuote && <QuoteForm quote={editQuote} onSave={saveQuote} onCancel={()=>setScreen("quotes")}/>}
      {screen==="quoteDetail" && viewQuote && <QuoteDetail quote={quotes.find(q=>q.id===viewQuote.id)||viewQuote} onBack={()=>setScreen("quotes")} onEdit={()=>{setEditQuote(quotes.find(q=>q.id===viewQuote.id)||viewQuote);setScreen("quoteForm");}} onDelete={()=>deleteQuote(viewQuote.id)} onAccept={()=>acceptQuote(viewQuote.id)} onUpdateQuote={q=>setQuotes(p=>p.map(x=>x.id===q.id?q:x))}/>}
    </div>
  );
}

// ─── Home ─────────────────────────────────────────────────────────────────────
function HomeScreen({ onNav, jobs, quotes }){
  const pending = quotes.filter(q=>q.status==="borrador"||q.status==="enviada").length;
  const porRealizar = jobs.filter(j=>j.status==="por_realizar").length;
  return (
    <div style={S.screen}>
      <div style={S.heroHeader}>
        <img src={LOGO_URI} alt="Logo" style={S.heroLogoImg}/>
        <div style={S.heroTitle}>{COMPANY.name}</div>
        <div style={S.heroSub}>{COMPANY.brand} · {COMPANY.city}</div>
      </div>
      <div style={S.homeCards}>
        <HomeCard icon="📊" title="Gestión de trabajos"  desc="Dashboard con estadísticas y resumen"          color="#007aff" badge={jobs.length}      onClick={()=>onNav("dashboard")}/>
        <HomeCard icon="🖌️" title="Trabajos realizados"  desc="Historial y trabajos por realizar"             color="#34c759" badge={porRealizar||null} badgeColor="#ff9500" onClick={()=>onNav("jobs")}/>
        <HomeCard icon="📋" title="Presupuestos"         desc="Crea y envía cotizaciones a tus clientes"      color="#ff3b30" badge={pending||null}     onClick={()=>onNav("quotes")}/>
      </div>
      <div style={S.homeFooter}>Paintforlife · {COMPANY.city}</div>
    </div>
  );
}
function HomeCard({ icon, title, desc, color, badge, badgeColor, onClick }){
  return (
    <div style={{...S.homeCard,borderLeft:`4px solid ${color}`}} onClick={onClick} className="hcard">
      <div style={S.homeCardLeft}>
        <div style={{...S.homeCardIcon,background:`${color}18`}}>{icon}</div>
        <div style={S.homeCardText}>
          <div style={S.homeCardTitle}>{title}</div>
          <div style={S.homeCardDesc}>{desc}</div>
        </div>
      </div>
      <div style={S.homeCardRight}>
        {badge ? <div style={{...S.homeBadge,background:badgeColor||color}}>{badge}</div> : null}
        <div style={{...S.chevron,color}}>›</div>
      </div>
    </div>
  );
}

// ─── Dashboard ────────────────────────────────────────────────────────────────
function DashboardScreen({ jobs, dash, setDash, onBack, onOpenJob }){
  const thisMonth = new Date().toISOString().slice(0,7);
  const monthJobs = jobs.filter(j=>j.date?.startsWith(thisMonth));
  const clients   = [...new Set(jobs.map(j=>j.client))];
  return (
    <div style={S.screen}>
      <NavBar title="Dashboard" onBack={onBack}/>
      <div style={S.formScroll}>
        <div style={S.dashGrid}>
          <DashCard icon="📋" val={jobs.length}      label="Proyectos" active={dash==="projects"} color="#007aff" onClick={()=>setDash(dash==="projects"?null:"projects")}/>
          <DashCard icon="📅" val={monthJobs.length}  label="Este mes"  active={dash==="month"}    color="#ff9500" onClick={()=>setDash(dash==="month"?null:"month")}/>
          <DashCard icon="👥" val={clients.length}    label="Clientes"  active={dash==="clients"}  color="#34c759" onClick={()=>setDash(dash==="clients"?null:"clients")}/>
        </div>
        {dash && (
          <div style={{margin:"0 16px"}}>
            {dash==="clients" ? (
              clients.length===0 ? <EmptyState icon="👥" msg="Sin clientes"/> :
              clients.map(client=>{
                const cj=jobs.filter(j=>j.client===client);
                return (
                  <div key={client} style={{...S.card,marginBottom:10}}>
                    <div style={{padding:"12px 16px"}}>
                      <div style={{fontSize:16,fontWeight:700}}>{client}</div>
                      <div style={{fontSize:13,color:"#8e8e93"}}>{cj.length} proyecto{cj.length!==1?"s":""}</div>
                    </div>
                    {cj.map((j,i)=><div key={j.id}>{i>0&&<Divider/>}<div style={{padding:"10px 16px",cursor:"pointer"}} onClick={()=>onOpenJob(j)} className="cell"><div style={{fontSize:14,color:"#007aff"}}>{j.address}{j.city?`, ${j.city}`:""}</div><div style={{fontSize:12,color:"#8e8e93"}}>{fmtShort(j.date)}</div></div></div>)}
                  </div>
                );
              })
            ) : (
              <>
                <div style={S.dashPanelTitle}>{dash==="projects"?"Todos los proyectos":"Este mes"}</div>
                {(dash==="projects"?jobs:monthJobs).length===0 ? <EmptyState icon="📋" msg="Sin datos"/> :
                  <div style={S.card}>{(dash==="projects"?jobs:monthJobs).map((j,i,a)=><JobRow key={j.id} job={j} onOpen={()=>onOpenJob(j)} last={i===a.length-1}/>)}</div>
                }
              </>
            )}
          </div>
        )}
        <div style={{height:40}}/>
      </div>
    </div>
  );
}
function DashCard({ icon, val, label, active, color, onClick }){
  return (
    <div style={{...S.dashCard,background:active?color:"#fff",border:`2px solid ${active?color:"transparent"}`}} onClick={onClick} className="hcard">
      <div style={{fontSize:26}}>{icon}</div>
      <div style={{fontSize:28,fontWeight:700,color:active?"#fff":"#000",marginTop:4}}>{val}</div>
      <div style={{fontSize:12,color:active?"rgba(255,255,255,.8)":"#8e8e93",marginTop:2}}>{label}</div>
    </div>
  );
}

// ─── Jobs Screen ──────────────────────────────────────────────────────────────
function JobsScreen({ jobs, onBack, onNew, onOpen, onStatusChange }){
  const [search,setSearch]=useState("");
  const [filter,setFilter]=useState("all"); // all | por_realizar | realizado
  const filtered = jobs.filter(j=>{
    const q=search.toLowerCase();
    const ms=!q||j.client?.toLowerCase().includes(q)||j.address?.toLowerCase().includes(q)||j.tasks?.some(t=>t.paintCode?.toLowerCase().includes(q));
    const mf=filter==="all"||j.status===filter;
    return ms&&mf;
  });
  return (
    <div style={S.screen}>
      <NavBar title="Trabajos realizados" onBack={onBack}/>
      <div style={S.formScroll}>
        <div style={S.searchWrap}>
          <span style={S.searchIcon}>🔍</span>
          <input style={S.searchInput} placeholder="Buscar cliente, código..." value={search} onChange={e=>setSearch(e.target.value)}/>
          {search&&<button style={S.searchClear} onClick={()=>setSearch("")}>✕</button>}
        </div>
        <div style={S.filterRow}>
          {[["all","Todos"],["por_realizar","Por realizar"],["realizado","Realizados"]].map(([v,l])=>(
            <button key={v} style={{...S.filterBtn,...(filter===v?S.filterBtnActive:{})}} onClick={()=>setFilter(v)}>{l}</button>
          ))}
        </div>
        <div style={{margin:"0 16px"}}>
          {filtered.length===0 ? <EmptyState icon="🖌️" msg="Sin proyectos" sub='Toca "+" para agregar'/> :
            <div style={S.card}>{filtered.map((j,i)=><JobRow key={j.id} job={j} onOpen={()=>onOpen(j)} last={i===filtered.length-1}/>)}</div>
          }
        </div>
        <div style={{height:40}}/>
      </div>
      <button style={S.fab} onClick={onNew} className="fab">+</button>
    </div>
  );
}
function JobRow({ job, onOpen, last }){
  const t=job.tasks?.[0]; const n=job.tasks?.length||0;
  const isPending = job.status==="por_realizar";
  return (
    <div style={{...S.jobRow,borderBottom:last?"none":"0.5px solid rgba(0,0,0,0.1)"}} onClick={onOpen} className="cell">
      <div style={S.jobRowLeft}>
        <div style={{...S.jobRowClient,display:"flex",alignItems:"center",gap:8}}>
          {job.client||"Sin nombre"}
          {isPending && <span style={S.badgePending}>Por realizar</span>}
        </div>
        <div style={S.jobRowAddr}>📍 {job.address}{job.city?`, ${job.city}`:""}</div>
        {t?.workType&&<div style={S.jobRowTags}><span style={S.tag}>{t.workType==="Otro"?t.workTypeOther||"Otro":t.workType}</span>{n>1&&<span style={S.tagMore}>+{n-1} más</span>}</div>}
      </div>
      <div style={S.jobRowRight}><div style={S.jobRowDate}>{fmtShort(job.date)}</div><div style={S.chevron}>›</div></div>
    </div>
  );
}

// ─── Job Form ─────────────────────────────────────────────────────────────────
function JobForm({ job:init, onSave, onCancel }){
  const [job,setJob]=useState(init);
  const [errors,setErrors]=useState({});
  function setField(k,v){ setJob(j=>({...j,[k]:v})); }
  function setTask(uid,k,v){ setJob(j=>({...j,tasks:j.tasks.map(t=>t.uid===uid?{...t,[k]:v}:t)})); }
  function validate(){ const e={}; if(!job.client.trim())e.client=true; if(!job.address.trim())e.address=true; setErrors(e); return !Object.keys(e).length; }
  return (
    <div style={S.screen}>
      <NavBarForm title="Proyecto" onCancel={onCancel} onSave={()=>{ if(validate()) onSave(job); }}/>
      <div style={S.formScroll}>

function QuantityInputs({ task, onChange }){
  const inp=(label,key,ph)=>(
    <div style={{display:"flex",alignItems:"center",gap:8}}>
      <span style={{fontSize:12,color:"#8e8e93",width:60,flexShrink:0}}>{label}</span>
      <input style={{...S.textInput,flex:1}} type="number" min="0" step="0.1" placeholder={ph} value={task[key]} onChange={e=>onChange(key,e.target.value)}/>
    </div>
  );
  if(task.quantityType==="litros")  return inp("Litros","liters","Ej: 4.5");
  if(task.quantityType==="cubetas") return inp("Cubetas","buckets","Ej: 2");
  if(task.quantityType==="galones") return inp("Galones","gallons","Ej: 1");
  return <div style={{display:"flex",flexDirection:"column",gap:8}}>{inp("Litros","liters","0")}{inp("Cubetas","buckets","0")}{inp("Galones","gallons","0")}</div>;
}

function JobDetail({ job, onBack, onEdit, onDelete, onStatusChange }){
  const [del,setDel]=useState(false);
  const isPending = job.status==="por_realizar";
  function fmtQty(t){ const p=[]; if(t.liters)p.push(`${t.liters} L`); if(t.buckets)p.push(`${t.buckets} cubeta${t.buckets!=="1"?"s":""}`); if(t.gallons)p.push(`${t.gallons} galón${t.gallons!=="1"?"es":""}`); return p.join(" + ")||"—"; }
  return (
    <div style={S.screen}>
      <NavBarForm title="Detalle" onCancel={onBack} cancelLabel="‹ Atrás" onSave={onEdit} saveLabel="Editar"/>
      <div style={S.formScroll}>
        <div style={{...S.detailHero,background:isPending?"linear-gradient(135deg,#ff9500,#ff6b00)":"linear-gradient(135deg,#34c759,#30a14e)"}}>
          <div style={S.detailId}>{job.id}</div>
          <div style={S.detailClient}>{job.client}</div>
          <div style={S.detailAddr}>📍 {job.address}{job.city?`, ${job.city}`:""}</div>
          <div style={S.detailDate}>📅 {fmtDate(job.date)}</div>
          <div style={{marginTop:10}}>
            <span style={{background:"rgba(255,255,255,.25)",padding:"4px 14px",borderRadius:20,fontSize:13,color:"#fff",fontWeight:600}}>
              {isPending?"⏳ Por realizar":"✅ Realizado"}
            </span>
          </div>
        </div>

        {isPending && (
          <div style={{padding:"16px 16px 0"}}>
            <button style={S.doneBtn} onClick={()=>onStatusChange(job.id,"realizado")}>
              ✅ Marcar como realizado
            </button>
          </div>
        )}

        {job.tasks?.map((task,idx)=>(
          <div key={task.uid}>
            <SectionHeader label={`TRABAJO #${idx+1}`}/>
            <div style={S.card}>
              <DetailRow icon="🔨" label="Tipo"    value={task.workType==="Otro"?task.workTypeOther:task.workType}/>
              {task.paintBrand&&<><Divider/><DetailRow icon="🏷" label="Marca"   value={task.paintBrand==="Otra"?task.paintBrandOther:task.paintBrand}/></>}
              {task.finish    &&<><Divider/><DetailRow icon="✨" label="Acabado" value={task.finish}/></>}
              {task.paintColor&&<><Divider/><DetailRow icon="🎨" label="Color"   value={task.paintColor}/></>}
              {task.paintCode &&<><Divider/><DetailRow icon="🔑" label="Clave"   value={<span style={S.codeVal}>{task.paintCode}</span>}/></>}
              {(task.liters||task.buckets||task.gallons)&&<><Divider/><DetailRow icon="💧" label="Cantidad" value={fmtQty(task)}/></>}
              {task.notes     &&<><Divider/><DetailRow icon="📝" label="Notas"   value={task.notes} align="top"/></>}
            </div>
          </div>
        ))}
        <div style={{padding:"16px 16px 0"}}>
          {!del?<button style={S.deleteBtn} onClick={()=>setDel(true)}>Eliminar proyecto</button>
               :<div style={S.confirmBox}><div style={{fontSize:15}}>¿Eliminar este proyecto?</div><div style={{display:"flex",gap:10,marginTop:12}}><button style={S.btnCancel} onClick={()=>setDel(false)}>Cancelar</button><button style={S.btnConfirmDel} onClick={onDelete}>Eliminar</button></div></div>
          }
        </div>
        <div style={{height:40}}/>
      </div>
    </div>
  );
}

const statusColor = { borrador:"#8e8e93", enviada:"#ff9500", aceptada:"#34c759", rechazada:"#ff3b30" };
const statusLabel = { borrador:"Borrador", enviada:"Enviada", aceptada:"Aceptada", rechazada:"Rechazada" };
function calcTotal(q){ const items=(q.items||[]).reduce((s,i)=>s+(parseFloat(i.price)||0)*(parseFloat(i.area)||1),0); const sub=items+(parseFloat(q.laborCost)||0)+(parseFloat(q.materialCost)||0)-(parseFloat(q.discount)||0); return sub+sub*(parseFloat(q.tax)||0)/100; }

function QuotesScreen({ quotes, jobs, onBack, onNew, onOpen }){

                      <span style={{...S.tag,background:`${statusColor[q.status]}22`,color:statusColor[q.status]}}>{statusLabel[q.status]}</span>
                      <span style={S.tagMore}>${calcTotal(q).toLocaleString("es-MX",{minimumFractionDigits:2})}</span>

// QUOTE FORM CON MOTOR LOCAL
// ═══════════════════════════════════════════════════════════
function QuoteForm({ quote:init, onSave, onCancel }){
  const isNew = !init.items || init.items.length === 0;
  const [q, setQ] = useState(init);
  const [mode, setMode] = useState(isNew ? "auto" : "manual"); // auto | manual
  const [autoParams, setAutoParams] = useState({
    tipoTrabajo: "interior",
    metros: "",
    manos: 1,
    pinturaKey: "PT_COM_VNT",
    equipoAirless: false,
    resanadoExcesivo: false,
    casaHabitada: false,
    cristalFino: false,
    humedadSevera: false,
    alturaRapel: false,
    herreriaItems: [],
    anticipo: 40,
  });
  const [calculated, setCalculated] = useState(false);

  function setF(k,v){ setQ(x=>({...x,[k]:v})); }
  function setP(k,v){ setAutoParams(p=>({...p,[k]:v})); }
  function setItem(uid,k,v){ setQ(x=>({...x,items:x.items.map(i=>i.uid===uid?{...i,[k]:v}:i)})); }

  function runCalculation(){
    const mods = [];
    if(autoParams.casaHabitada)  mods.push("casaHabitada");
    if(autoParams.cristalFino)   mods.push("cristalFino");
    if(autoParams.humedadSevera) mods.push("humedadSevera");
    if(autoParams.alturaRapel)   mods.push("alturaRapel");

    const result = calcularPresupuesto({
      tipoTrabajo:     autoParams.tipoTrabajo,
      metros:          parseFloat(autoParams.metros)||0,
      manos:           autoParams.manos,
      pinturaKey:      autoParams.pinturaKey,
      equipoAirless:   autoParams.equipoAirless,
      modificadoresSel: mods,
      resanadoExcesivo: autoParams.resanadoExcesivo,
      herreriaItems:   autoParams.herreriaItems,
      anticipo:        autoParams.anticipo,
    });

    const items = result.conceptos.map(c=>({
      uid: Math.random().toString(36).slice(2),
      description: c.descripcion,
      area: String(c.area),
      unit: c.unit,
      price: String(c.precio)
    }));

    setQ(x=>({
      ...x,
      items,
      laborCost: "",
      materialCost: "",
      discount: "",
      tax: "0",
      notes: autoParams.anticipo > 0
        ? `Se solicita anticipo del ${autoParams.anticipo}% ($${result.anticipoMonto.toLocaleString("es-MX",{minimumFractionDigits:2})} MXN) para iniciar el trabajo.`
        : x.notes
    }));
    setCalculated(true);
  }

  // Totals
  const items=(q.items||[]).reduce((s,i)=>s+(parseFloat(i.price)||0)*(parseFloat(i.area)||1),0);
  const labor=parseFloat(q.laborCost)||0, mat=parseFloat(q.materialCost)||0, disc=parseFloat(q.discount)||0;
  const sub=items+labor+mat-disc, taxAmt=sub*(parseFloat(q.tax)||0)/100, total=sub+taxAmt;

  const TIPOS = [
    ["interior","🏠 Interior"],["techo","⬆️ Techo/Plafón"],
    ["exterior_bajo","🏡 Exterior (≤2.5m)"],["exterior_alto","🏢 Exterior (>2.5m)"],
    ["herreria","🔧 Herrería"]
  ];
  const PINTURAS_LIST = Object.entries(DB.pinturas).map(([k,v])=>([k,`${v.marca} ${v.linea}`]));

  return (
    <div style={S.screen}>
      <NavBarForm title="Cotización" onCancel={onCancel} onSave={()=>onSave(q)}/>
      <div style={S.formScroll}>

        {/* Mode toggle */}
        <div style={{padding:"16px 16px 4px"}}>
          <div style={S.modeToggle}>
            <button style={{...S.modeBtn,...(mode==="auto"?{...S.modeBtnActive,background:"#1a1a1a",color:"#fff"}:{})}} onClick={()=>setMode("auto")}>⚡ Cálculo automático</button>
            <button style={{...S.modeBtn,...(mode==="manual"?S.modeBtnActive:{})}} onClick={()=>setMode("manual")}>✏️ Manual</button>
          </div>
        </div>

        {/* CLIENT DATA - always visible */}
        <SectionHeader label="DATOS DEL CLIENTE"/>
        <div style={S.card}>
          <FormRow label="Cliente"><input style={S.textInput} placeholder="Nombre completo" value={q.client} onChange={e=>setF("client",e.target.value)}/></FormRow>
          <Divider/>
          <FormRow label="Teléfono"><input style={S.textInput} placeholder="443 123 4567" type="tel" value={q.clientPhone} onChange={e=>setF("clientPhone",e.target.value)}/></FormRow>
          <Divider/>
          <FormRow label="Dirección"><input style={S.textInput} placeholder="Dirección del trabajo" value={q.address} onChange={e=>setF("address",e.target.value)}/></FormRow>
          <Divider/>
          <FormRow label="Ciudad"><input style={S.textInput} placeholder="Morelia, Mich." value={q.city} onChange={e=>setF("city",e.target.value)}/></FormRow>
        </div>

        {/* AUTO MODE */}
        {mode==="auto" && (
          <>
            <SectionHeader label="TIPO DE TRABAJO"/>
            <div style={S.card}>
              <div style={{padding:"12px 16px",display:"flex",flexWrap:"wrap",gap:8}}>
                {TIPOS.map(([v,l])=>(
                  <button key={v}
                    style={{...S.typePill,...(autoParams.tipoTrabajo===v?S.typePillActive:{})}}
                    onClick={()=>setP("tipoTrabajo",v)}>{l}
                  </button>
                ))}
              </div>
            </div>

            {autoParams.tipoTrabajo !== "herreria" ? (
              <>
                <SectionHeader label="MEDIDAS Y MATERIAL"/>
                <div style={S.card}>
                  <FormRow label="Metros m²">
                    <input style={S.textInput} type="number" placeholder="Ej: 150" value={autoParams.metros} onChange={e=>setP("metros",e.target.value)}/>
                  </FormRow>
                  <Divider/>
                  <FormRow label="Manos de pintura">
                    <div style={{...S.segmentRow,flex:1}}>
                      <button style={{...S.segment,...(autoParams.manos===1?S.segmentActive:{})}} onClick={()=>setP("manos",1)}>1 mano</button>
                      <button style={{...S.segment,...(autoParams.manos===2?S.segmentActive:{})}} onClick={()=>setP("manos",2)}>2 manos</button>
                    </div>
                  </FormRow>
                  <Divider/>
                  <FormRow label="Pintura">
                    <select style={S.selectInput} value={autoParams.pinturaKey} onChange={e=>setP("pinturaKey",e.target.value)}>
                      {PINTURAS_LIST.map(([k,l])=><option key={k} value={k}>{l}</option>)}
                    </select>
                  </FormRow>
                </div>

                <SectionHeader label="CONDICIONES DEL TRABAJO"/>
                <div style={S.card}>
                  {[
                    ["equipoAirless","⚙️ Usa equipo Airless"],
                    ["casaHabitada","🏠 Casa habitada / amueblada"],
                    ["alturaRapel","🧗 Trabajo en altura (arnés/rapel)"],
                    ["cristalFino","🪟 Protección de cristal / aluminio fino"],
                    ["humedadSevera","💧 Daño por humedad / salitre"],
                    ["resanadoExcesivo","🔨 Resanado excesivo"],
                  ].map(([key,label],i,arr)=>(
                    <div key={key}>
                      {i>0&&<Divider/>}
                      <div style={{...S.formRow,cursor:"pointer"}} onClick={()=>setP(key,!autoParams[key])}>
                        <span style={{...S.formLabel,color:"#000"}}>{label}</span>
                        <div style={{...S.toggle,background:autoParams[key]?"#34c759":"#e0e0e0"}}>
                          <div style={{...S.toggleThumb,transform:autoParams[key]?"translateX(20px)":"translateX(2px)"}}/>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </>
            ) : (
              /* HERRERÍA */
              <>
                <SectionHeader label="PIEZAS DE HERRERÍA"/>
                <div style={S.card}>
                  {Object.entries(DB.herreria).map(([key,h],i,arr)=>(
                    <div key={key}>
                      {i>0&&<Divider/>}
                      <div style={{...S.formRow,alignItems:"center"}}>
                        <span style={{...S.formLabel,fontSize:14,width:160}}>{h.nombre}</span>
                        <div style={{display:"flex",alignItems:"center",gap:10,justifyContent:"flex-end",flex:1}}>
                          <span style={{fontSize:12,color:"#8e8e93"}}>${h.precioMin===h.precioMax?h.precioMin:`${h.precioMin}-${h.precioMax}`}</span>
                          <button style={S.qtyBtn} onClick={()=>{
                            const items=[...(autoParams.herreriaItems||[])];
                            const idx=items.findIndex(x=>x.key===key);
                            if(idx>=0){ if(items[idx].cantidad>0)items[idx]={...items[idx],cantidad:items[idx].cantidad-1}; else items.splice(idx,1); }
                            setP("herreriaItems",items);
                          }}>−</button>
                          <span style={{fontSize:16,fontWeight:700,minWidth:20,textAlign:"center"}}>
                            {autoParams.herreriaItems?.find(x=>x.key===key)?.cantidad||0}
                          </span>
                          <button style={{...S.qtyBtn,background:"#1a1a1a",color:"#fff"}} onClick={()=>{
                            const items=[...(autoParams.herreriaItems||[])];
                            const idx=items.findIndex(x=>x.key===key);
                            if(idx>=0)items[idx]={...items[idx],cantidad:items[idx].cantidad+1};
                            else items.push({key,cantidad:1});
                            setP("herreriaItems",items);
                          }}>+</button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </>
            )}

            {/* ANTICIPO */}
            <SectionHeader label="ANTICIPO (OPCIONAL)"/>
            <div style={S.card}>
              <div style={{...S.formRow,cursor:"pointer"}} onClick={()=>setP("anticipo",autoParams.anticipo>0?0:40)}>
                <span style={{...S.formLabel}}>Incluir anticipo</span>
                <div style={{...S.toggle,background:autoParams.anticipo>0?"#34c759":"#e0e0e0"}}>
                  <div style={{...S.toggleThumb,transform:autoParams.anticipo>0?"translateX(20px)":"translateX(2px)"}}/>
                </div>
              </div>
              {autoParams.anticipo>0&&(
                <>
                  <Divider/>
                  <FormRow label={`Anticipo ${autoParams.anticipo}%`}>
                    <input style={S.textInput} type="range" min="40" max="60" step="5"
                      value={autoParams.anticipo} onChange={e=>setP("anticipo",parseInt(e.target.value))}
                      style={{width:"100%",accentColor:"#1a1a1a"}}/>
                  </FormRow>
                  <div style={{padding:"4px 16px 10px",display:"flex",justifyContent:"space-between"}}>
                    {[40,45,50,55,60].map(v=>(
                      <button key={v} style={{...S.qtyBtn,...(autoParams.anticipo===v?{background:"#1a1a1a",color:"#fff"}:{})}} onClick={()=>setP("anticipo",v)}>{v}%</button>
                    ))}
                  </div>
                </>
              )}
            </div>

            {/* CALCULATE BUTTON */}
            <div style={{padding:"16px 16px 0"}}>
              <button style={{...S.doneBtn,background:"#1a1a1a",fontSize:17}} onClick={runCalculation}>
                ⚡ Calcular presupuesto
              </button>
            </div>
          </>
        )}

        {/* ITEMS - shown after calculation or in manual mode */}
        {(calculated || mode==="manual") && q.items.length>0 && (
          <>
            <SectionHeader label={calculated?"DESGLOSE CALCULADO (EDITABLE)":"CONCEPTOS"}/>
            {q.items.map((item,idx)=>(
              <div key={item.uid} style={{...S.card,marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",padding:"10px 16px 6px"}}>
                  <span style={{fontSize:12,fontWeight:600,color:"#8e8e93"}}>CONCEPTO #{idx+1}</span>
                  {q.items.length>1&&<button style={S.taskRemove} onClick={()=>setQ(x=>({...x,items:x.items.filter(i=>i.uid!==item.uid)}))}>Eliminar</button>}
                </div>
                <Divider/>
                <FormRow label="Descripción"><input style={S.textInput} placeholder="Descripción" value={item.description} onChange={e=>setItem(item.uid,"description",e.target.value)}/></FormRow>
                <Divider/>
                <FormRow label="Área / cant.">
                  <div style={{display:"flex",gap:6,justifyContent:"flex-end"}}>
                    <input style={{...S.textInput,width:70}} type="number" placeholder="0" value={item.area} onChange={e=>setItem(item.uid,"area",e.target.value)}/>
                    <select style={{...S.selectInput,width:80}} value={item.unit} onChange={e=>setItem(item.uid,"unit",e.target.value)}>{["m²","L","pza","servicio","estimado","hr"].map(u=><option key={u} value={u}>{u}</option>)}</select>
                  </div>
                </FormRow>
                <Divider/>
                <FormRow label="Precio unit."><div style={{display:"flex",alignItems:"center",gap:4,justifyContent:"flex-end"}}><span style={{color:"#8e8e93"}}>$</span><input style={{...S.textInput,width:110}} type="number" placeholder="0.00" value={item.price} onChange={e=>setItem(item.uid,"price",e.target.value)}/></div></FormRow>
                <Divider/>
                <div style={{padding:"8px 16px",display:"flex",justifyContent:"space-between"}}>
                  <span style={{fontSize:13,color:"#8e8e93"}}>Subtotal</span>
                  <span style={{fontSize:14,fontWeight:600}}>${((parseFloat(item.price)||0)*(parseFloat(item.area)||1)).toLocaleString("es-MX",{minimumFractionDigits:2})}</span>
                </div>
              </div>
            ))}
            <button style={S.addTaskBtn} onClick={()=>setQ(x=>({...x,items:[...x.items,{uid:Math.random().toString(36).slice(2),description:"",area:"",unit:"m²",price:""}]}))} className="addtask">
              <span style={{fontSize:18,marginRight:8}}>+</span>Agregar concepto
            </button>

            <SectionHeader label="AJUSTES FINALES"/>
            <div style={S.card}>
              <FormRow label="Descuento"><div style={{display:"flex",alignItems:"center",gap:4,justifyContent:"flex-end"}}><span style={{color:"#8e8e93"}}>$</span><input style={{...S.textInput,width:120}} type="number" placeholder="0.00" value={q.discount} onChange={e=>setF("discount",e.target.value)}/></div></FormRow>
              <Divider/>
              <FormRow label="IVA"><select style={S.selectInput} value={q.tax} onChange={e=>setF("tax",e.target.value)}><option value="0">Sin IVA</option><option value="8">8%</option><option value="16">16%</option></select></FormRow>
            </div>

            {/* TOTAL SUMMARY */}
            <div style={{...S.card,margin:"8px 16px"}}>
              <TRow l="Conceptos" v={items}/>
              {disc>0&&<><Divider/><TRow l="Descuento" v={-disc} neg/></>}
              {taxAmt>0&&<><Divider/><TRow l={`IVA (${q.tax}%)`} v={taxAmt}/></>}
              <div style={{height:1,background:"#1a1a1a",margin:"0 16px"}}/>
              <div style={{display:"flex",justifyContent:"space-between",padding:"14px 16px",background:"#f5f5f5",borderRadius:"0 0 12px 12px"}}>
                <span style={{fontSize:17,fontWeight:700,color:"#1a1a1a"}}>TOTAL</span>
                <span style={{fontSize:22,fontWeight:800,color:"#1a1a1a"}}>${total.toLocaleString("es-MX",{minimumFractionDigits:2})}</span>
              </div>
            </div>
          </>
        )}

        <SectionHeader label="DETALLES"/>
        <div style={S.card}>
          <FormRow label="Fecha"><input style={S.textInput} type="date" value={q.date} onChange={e=>setF("date",e.target.value)}/></FormRow>
          <Divider/>
          <FormRow label="Válida por"><div style={{display:"flex",alignItems:"center",gap:6,justifyContent:"flex-end"}}><input style={{...S.textInput,width:60}} type="number" value={q.validDays} onChange={e=>setF("validDays",e.target.value)}/><span style={{fontSize:15,color:"#8e8e93"}}>días</span></div></FormRow>
          <Divider/>
          <FormRow label="Estado"><select style={S.selectInput} value={q.status} onChange={e=>setF("status",e.target.value)}><option value="borrador">Borrador</option><option value="enviada">Enviada</option><option value="aceptada">Aceptada</option><option value="rechazada">Rechazada</option></select></FormRow>
        </div>
        <SectionHeader label="NOTAS"/>
        <div style={S.card}><FormRow label="Notas" align="top"><textarea style={S.textArea} placeholder="Condiciones, tiempo de entrega..." value={q.notes} onChange={e=>setF("notes",e.target.value)} rows={4}/></FormRow></div>
        <div style={{height:40}}/>
      </div>
    </div>
  );
}

function TRow({ l, v, neg }){
  return <div style={{display:"flex",justifyContent:"space-between",padding:"10px 16px"}}><span style={{fontSize:15,color:"#8e8e93"}}>{l}</span><span style={{fontSize:15,fontWeight:500,color:neg?"#ff3b30":"#000"}}>{neg?"-":""}${Math.abs(v).toLocaleString("es-MX",{minimumFractionDigits:2})}</span></div>;
}

// ─── Quote Detail ─────────────────────────────────────────────────────────────
function QuoteDetail({ quote:q, onBack, onEdit, onDelete, onAccept, onUpdateQuote }){
  const [del,setDel]=useState(false);
  const [generating,setGenerating]=useState(false);
  const total=calcTotal(q);

  async function processWithAI(){
    if(!navigator.onLine){ alert("Necesitas internet para procesar con IA."); return; }
    setGenerating(true);
    try {
      const prompt = `Eres un experto en presupuestos de pintura en México. El pintor es ${COMPANY.name} de ${COMPANY.city}.
Genera un presupuesto detallado:
- Cliente: ${q.client||"Cliente"}
- Tipo de trabajo: ${q.workType||"Pintura interior"}
- Metros cuadrados: ${q.sqMeters||"no especificado"} m²
- Valor final: $${q.totalTarget||"no especificado"} MXN
- IVA: ${q.tax}%

Responde SOLO con JSON válido:
{"items":[{"description":"string","area":"número","unit":"m²","price":"número"}],"laborCost":"número","materialCost":"número","notes":"string"}`;

      const resp = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:prompt}]})
      });
      const data = await resp.json();
      const text = data.content?.map(c=>c.text||"").join("")||"";
      const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
      const updated = {...q, items:parsed.items.map(i=>({...i,uid:Math.random().toString(36).slice(2)})), laborCost:parsed.laborCost||"", materialCost:parsed.materialCost||"", notes:parsed.notes||q.notes, pendingAI:false, aiGenerated:true};
      onUpdateQuote(updated);
    } catch(e){ alert("Error al procesar con IA."); }
    setGenerating(false);
  }

  function handleShare(){
    const text = buildQuoteText(q,total);
    if(navigator.share){ navigator.share({title:`Cotización ${q.id}`,text}); }
    else if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>alert("¡Cotización copiada!")); }
  }

  function generatePDF(){
    const items=(q.items||[]).reduce((s,i)=>s+(parseFloat(i.price)||0)*(parseFloat(i.area)||1),0);
    const labor=parseFloat(q.laborCost)||0, mat=parseFloat(q.materialCost)||0, disc=parseFloat(q.discount)||0;
    const sub=items+labor+mat-disc, taxAmt=sub*(parseFloat(q.tax)||0)/100;

    const win = window.open("","_blank");
    win.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"/>
<title>Cotización ${q.id}</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Helvetica Neue',Arial,sans-serif;color:#1a1a1a;padding:40px;background:#fff;}
  .header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:32px;padding-bottom:20px;border-bottom:3px solid #1a1a1a;}
  .logo{width:90px;height:90px;object-fit:contain;}
  .company{text-align:right;}
  .company h1{font-size:22px;font-weight:800;color:#1a1a1a;}
  .company p{font-size:13px;color:#666;margin-top:2px;}
  .quote-title{background:#1a1a1a;color:#fff;padding:12px 20px;border-radius:8px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;}
  .quote-title h2{font-size:18px;font-weight:700;}
  .quote-title span{font-size:13px;opacity:.8;}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;}
  .info-box{background:#f8f8f8;border-radius:8px;padding:14px 16px;}
  .info-box label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#888;margin-bottom:4px;display:block;}
  .info-box p{font-size:15px;font-weight:600;color:#1a1a1a;}
  table{width:100%;border-collapse:collapse;margin-bottom:20px;}
  th{background:#1a1a1a;color:#fff;padding:10px 14px;text-align:left;font-size:13px;}
  td{padding:10px 14px;border-bottom:1px solid #eee;font-size:14px;}
  tr:nth-child(even) td{background:#fafafa;}
  .totals{margin-left:auto;width:280px;}
  .totals-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:14px;}
  .totals-row.final{font-size:18px;font-weight:800;color:#1a1a1a;border-top:3px solid #1a1a1a;border-bottom:none;padding-top:12px;margin-top:4px;}
  .notes{background:#fff8f0;border-left:4px solid #ff9500;padding:14px 16px;border-radius:0 8px 8px 0;margin-top:24px;}
  .notes label{font-size:11px;text-transform:uppercase;color:#ff9500;font-weight:700;margin-bottom:6px;display:block;}
  .footer{text-align:center;margin-top:40px;padding-top:20px;border-top:1px solid #eee;color:#999;font-size:12px;}
  @media print{body{padding:20px;} .no-print{display:none;}}
</style>
</head><body>
<div class="header">
  <img src="${LOGO_URI}" class="logo" alt="Logo"/>
  <div class="company">
    <h1>${COMPANY.name}</h1>
    <p>${COMPANY.brand}</p>
    <p>${COMPANY.phone}</p>
    <p>${COMPANY.city}</p>
  </div>
</div>
<div class="quote-title">
  <h2>COTIZACIÓN ${q.id}</h2>
  <span>Válida por ${q.validDays} días · ${fmtDate(q.date)}</span>
</div>
<div class="info-grid">
  <div class="info-box"><label>Cliente</label><p>${q.client||"—"}</p></div>
  <div class="info-box"><label>Teléfono</label><p>${q.clientPhone||"—"}</p></div>
  <div class="info-box"><label>Dirección</label><p>${q.address||"—"}</p></div>
  <div class="info-box"><label>Ciudad</label><p>${q.city||COMPANY.city}</p></div>
</div>
<table>
  <thead><tr><th>Descripción</th><th>Cantidad</th><th>Precio Unit.</th><th>Total</th></tr></thead>
  <tbody>
    ${(q.items||[]).map(i=>`<tr><td>${i.description||"—"}</td><td>${i.area||0} ${i.unit}</td><td>$${parseFloat(i.price||0).toLocaleString("es-MX",{minimumFractionDigits:2})}</td><td>$${((parseFloat(i.price)||0)*(parseFloat(i.area)||1)).toLocaleString("es-MX",{minimumFractionDigits:2})}</td></tr>`).join("")}
  </tbody>
</table>
<div class="totals">
  <div class="totals-row"><span>Conceptos</span><span>$${items.toLocaleString("es-MX",{minimumFractionDigits:2})}</span></div>
  <div class="totals-row"><span>Mano de obra</span><span>$${labor.toLocaleString("es-MX",{minimumFractionDigits:2})}</span></div>
  <div class="totals-row"><span>Material extra</span><span>$${mat.toLocaleString("es-MX",{minimumFractionDigits:2})}</span></div>
  ${disc>0?`<div class="totals-row"><span>Descuento</span><span>-$${disc.toLocaleString("es-MX",{minimumFractionDigits:2})}</span></div>`:""}
  <div class="totals-row"><span>IVA (${q.tax}%)</span><span>$${taxAmt.toLocaleString("es-MX",{minimumFractionDigits:2})}</span></div>
  <div class="totals-row final"><span>TOTAL</span><span>$${total.toLocaleString("es-MX",{minimumFractionDigits:2})}</span></div>
</div>
${q.notes?`<div class="notes"><label>Notas y condiciones</label><p>${q.notes}</p></div>`:""}
<div class="footer">
  <p>${COMPANY.name} · ${COMPANY.brand} · ${COMPANY.phone} · ${COMPANY.city}</p>
  <p style="margin-top:4px">Documento generado por Paintforlife</p>
</div>
<script>window.onload=()=>{ window.print(); }<\/script>
</body></html>`);
    win.document.close();
  }

  return (
    <div style={S.screen}>
      <NavBarForm title="Cotización" onCancel={onBack} cancelLabel="‹ Atrás" onSave={onEdit} saveLabel="Editar"/>
      <div style={S.formScroll}>
        <div style={{...S.detailHero,background:"linear-gradient(135deg,#ff3b30,#ff6b00)"}}>
          <div style={S.detailId}>{q.id}</div>
          <div style={S.detailClient}>{q.client||"Sin cliente"}</div>
          <div style={S.detailAddr}>📍 {q.address||"—"}</div>
          <div style={S.detailDate}>📅 {fmtDate(q.date)} · Válida {q.validDays} días</div>
          <div style={{marginTop:10,display:"flex",gap:8,alignItems:"center"}}>
            <span style={{background:"rgba(255,255,255,.25)",padding:"3px 12px",borderRadius:20,fontSize:13,color:"#fff",fontWeight:600}}>{statusLabel[q.status]}</span>
            {q.aiGenerated&&<span style={{background:"rgba(88,86,214,.5)",padding:"3px 12px",borderRadius:20,fontSize:12,color:"#fff"}}>🤖 IA</span>}
            <span style={{fontSize:22,fontWeight:700,color:"#fff",marginLeft:"auto"}}>${total.toLocaleString("es-MX",{minimumFractionDigits:2})}</span>
          </div>
        </div>

        {/* Pending AI banner */}
        {q.pendingAI && (
          <div style={{padding:"12px 16px 0"}}>
            <button style={{...S.shareBtn,background:generating?"#8e8e93":"#5856d6"}} onClick={processWithAI} disabled={generating}>
              {generating?"⏳ Procesando...":"🤖 Procesar con IA ahora"}
            </button>
          </div>
        )}

        {/* Accept button */}
        {q.status!=="aceptada" && q.status!=="rechazada" && (
          <div style={{padding:"12px 16px 0"}}>
            <button style={S.acceptBtn} onClick={onAccept}>
              ✅ Marcar como aceptado → Crear trabajo
            </button>
          </div>
        )}

        {q.clientPhone&&<><SectionHeader label="CONTACTO"/><div style={S.card}><DetailRow icon="📞" label="Teléfono" value={q.clientPhone}/></div></>}

        {q.items.length>0&&(
          <>
            <SectionHeader label="CONCEPTOS"/>
            <div style={S.card}>
              {q.items.map((item,i)=>(
                <div key={item.uid}>
                  {i>0&&<Divider/>}
                  <div style={{padding:"12px 16px"}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                      <span style={{fontSize:15,fontWeight:600,flex:1}}>{item.description||"—"}</span>
                      <span style={{fontSize:15,fontWeight:700,color:"#ff3b30"}}>${((parseFloat(item.price)||0)*(parseFloat(item.area)||1)).toLocaleString("es-MX",{minimumFractionDigits:2})}</span>
                    </div>
                    <span style={{fontSize:13,color:"#8e8e93"}}>{item.area||0} {item.unit} × ${parseFloat(item.price||0).toLocaleString("es-MX",{minimumFractionDigits:2})}</span>
                  </div>
                </div>
              ))}
            </div>
            <SectionHeader label="RESUMEN"/>
            <div style={S.card}>
              <TRow l="Conceptos" v={(q.items||[]).reduce((s,i)=>s+(parseFloat(i.price)||0)*(parseFloat(i.area)||1),0)}/>
              <Divider/><TRow l="Mano de obra" v={parseFloat(q.laborCost)||0}/>
              <Divider/><TRow l="Material" v={parseFloat(q.materialCost)||0}/>
              {(parseFloat(q.discount)||0)>0&&<><Divider/><TRow l="Descuento" v={parseFloat(q.discount)||0} neg/></>}
              <Divider/><TRow l={`IVA (${q.tax}%)`} v={total-( (parseFloat(q.laborCost)||0)+(parseFloat(q.materialCost)||0)+((q.items||[]).reduce((s,i)=>s+(parseFloat(i.price)||0)*(parseFloat(i.area)||1),0))-(parseFloat(q.discount)||0) )}/>
              <div style={{height:1,background:"#ff3b30",margin:"0 16px"}}/>
              <div style={{display:"flex",justifyContent:"space-between",padding:"14px 16px",background:"#fff5f5",borderRadius:"0 0 12px 12px"}}>
                <span style={{fontSize:17,fontWeight:700,color:"#ff3b30"}}>TOTAL</span>
                <span style={{fontSize:20,fontWeight:700,color:"#ff3b30"}}>${total.toLocaleString("es-MX",{minimumFractionDigits:2})}</span>
              </div>
            </div>
          </>
        )}

        {q.notes&&<><SectionHeader label="NOTAS"/><div style={S.card}><div style={{padding:"12px 16px",fontSize:15,lineHeight:1.5}}>{q.notes}</div></div></>}

        {/* Action buttons */}
        <div style={{padding:"16px 16px 0",display:"flex",flexDirection:"column",gap:10}}>
          <button style={S.shareBtn} onClick={handleShare}>📤 Enviar como mensaje</button>
          <button style={{...S.shareBtn,background:"#1a1a1a"}} onClick={generatePDF}>📄 Generar PDF profesional</button>
        </div>

        <div style={{padding:"8px 16px",marginTop:8}}>
          {!del?<button style={S.deleteBtn} onClick={()=>setDel(true)}>Eliminar cotización</button>
               :<div style={S.confirmBox}><div style={{fontSize:15}}>¿Eliminar esta cotización?</div><div style={{display:"flex",gap:10,marginTop:12}}><button style={S.btnCancel} onClick={()=>setDel(false)}>Cancelar</button><button style={S.btnConfirmDel} onClick={onDelete}>Eliminar</button></div></div>
          }
        </div>
        <div style={{height:40}}/>
      </div>
    </div>
  );
}

function buildQuoteText(q,total){
  return [
    `🎨 ${COMPANY.name} · ${COMPANY.brand}`,`━━━━━━━━━━━━━━━━━━━━`,`COTIZACIÓN ${q.id}`,``,
    `Cliente: ${q.client||"—"}`,`Dirección: ${q.address||"—"}`,`Fecha: ${fmtDate(q.date)}`,`Válida: ${q.validDays} días`,``,
    `📋 CONCEPTOS:`,
    ...(q.items||[]).map(i=>`• ${i.description||"—"}: ${i.area||0} ${i.unit} × $${parseFloat(i.price||0).toFixed(2)} = $${((parseFloat(i.price)||0)*(parseFloat(i.area)||1)).toFixed(2)}`),``,
    `💰 TOTAL: $${total.toLocaleString("es-MX",{minimumFractionDigits:2})}`,``,
    q.notes?`📝 ${q.notes}`:"",
    `━━━━━━━━━━━━━━━━━━━━`,`${COMPANY.phone} · ${COMPANY.city}`,
  ].filter(Boolean).join("\n");
}

function NavBarForm({ title, onCancel, onSave, cancelLabel="Cancelar", saveLabel="Guardar" }){ return <div style={S.navBarForm}><button style={S.navBtn} onClick={onCancel}>{cancelLabel}</button><div style={S.navTitleSm}>{title}</div><button style={S.navBtnBlue} onClick={onSave}>{saveLabel}</button></div>; }
